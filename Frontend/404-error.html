<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .error-code {
            font-size: 12rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 0 80px rgba(102, 126, 234, 0.3);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .error-title {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .error-message {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 3rem;
            line-height: 1.8;
        }

        .home-btn {
            display: inline-block;
            padding: 1rem 3rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .home-btn:active {
            transform: translateY(-1px);
        }

        /* 背景粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 8s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 1s; animation-duration: 10s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 2s; animation-duration: 8s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 0.5s; animation-duration: 12s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 1.5s; animation-duration: 9s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 3s; animation-duration: 11s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 2.5s; animation-duration: 8s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 0.8s; animation-duration: 10s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 2s; animation-duration: 9s; }
        .particle:nth-child(10) { left: 15%; animation-delay: 1.2s; animation-duration: 11s; }
        .particle:nth-child(11) { left: 25%; animation-delay: 2.8s; animation-duration: 8s; }
        .particle:nth-child(12) { left: 35%; animation-delay: 0.3s; animation-duration: 10s; }
        .particle:nth-child(13) { left: 45%; animation-delay: 1.8s; animation-duration: 9s; }
        .particle:nth-child(14) { left: 55%; animation-delay: 2.2s; animation-duration: 11s; }
        .particle:nth-child(15) { left: 65%; animation-delay: 0.6s; animation-duration: 8s; }
        .particle:nth-child(16) { left: 75%; animation-delay: 2.5s; animation-duration: 10s; }
        .particle:nth-child(17) { left: 85%; animation-delay: 1s; animation-duration: 9s; }
        .particle:nth-child(18) { left: 5%; animation-delay: 3s; animation-duration: 12s; }
        .particle:nth-child(19) { left: 95%; animation-delay: 0.2s; animation-duration: 8s; }
        .particle:nth-child(20) { left: 48%; animation-delay: 2.1s; animation-duration: 10s; }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .error-code {
                font-size: 8rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
            .error-message {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 6rem;
            }
            .error-title {
                font-size: 1.2rem;
            }
            .home-btn {
                padding: 0.8rem 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 背景粒子 -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- 主内容 -->
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">页面未找到</h1>
        <p class="error-message">
            抱歉，您访问的页面不存在或已被移除<br>
            请检查网址是否正确，或返回首页继续探索
        </p>
        <a href="/" class="home-btn">返回首页</a>
    </div>

    <script>
        // 鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const code = document.querySelector('.error-code');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            code.style.transform = `translateY(${Math.sin(Date.now() / 1000) * 20}px) rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // 随机生成更多粒子
        function createParticle() {
            const particles = document.querySelector('.particles');
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.animationDuration = (Math.random() * 5 + 8) + 's';
            particle.style.width = (Math.random() * 4 + 2) + 'px';
            particle.style.height = particle.style.width;
            particles.appendChild(particle);
            
            // 10秒后移除
            setTimeout(() => {
                particle.remove();
            }, 13000);
        }

        // 每2秒创建新粒子
        setInterval(createParticle, 2000);
    </script>
</body>
</html>
